# OPENOFFICE Properties (set manager_type to 'local'|'external'|'remote'|'none'; none = no LibreOffice)
jthumbnailer:
  # Thumbnail provider order (by provider name). Unlisted providers are tried after.
  providers:
    priority: []  # e.g. [FfmpegThumbnailer, MPEGThumbnailer, ThumbnailerAdapter]

  openoffice:
    manager_type: local
    ports: [2002]
    working-dir: /tmp
  thumbnail:
    thumbWidth: 400
    thumbHeight: 535

  # FFmpeg video thumbnail (system ffmpeg/ffprobe). Set enabled: false to use JavaCV fallback only.
  ffmpeg:
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    default-timestamp-sec: 1
    default-position-percent: 10
    frame-quality: 3
    max-duration-sec: 0
    multiple-frame-count: 1
    enabled: true

  openapi:
    name: "Java Thumbnail Generator"
    desc: "A thumbnail generation Java library for Office, PDF, HTML, Text, MP3, MPEG and Image documents"
    license-url: "https://github.com/makbn/JThumbnail/blob/master/LICENSE"

  server:
    upload_directory: "/tmp/upload"
    max_waiting_list_size: 1000

  # Persistent job queue (Kafka + DB). Jobs survive restart; failed jobs retry then go to DLQ.
  jobs:
    topic: thumbnail-jobs
    dead-letter-topic: thumbnail-jobs-dlq
    max-retries: 3
    consumer-concurrency: 1

  async:
    core-pool-size: 10
    max-pool-size: 32

  # S3-compatible storage event connector (AWS S3 / MinIO). Enable to trigger thumbnails on object-created.
  storage:
    enabled: false
    # endpoint-override: "http://minio:9000"   # MinIO
    region: us-east-1
    bucket-whitelist: []   # empty = all buckets
    file-type-include: []  # empty = all; e.g. [pdf, png, docx, jpg]
    output-strategy: SAME_BUCKET_PREFIX  # or DIFFERENT_BUCKET
    output-prefix: "thumbnails/"
    # output-bucket: "thumbnails-bucket"   # when output-strategy is DIFFERENT_BUCKET
    webhook-path: /storage/events
    # sqs-queue-url: "https://sqs.region.amazonaws.com/account/queue"  # optional; for AWS S3 event notifications
    # sqs-poll-interval-ms: 5000

  # AMQP connector (RabbitMQ / Azure Service Bus): consume thumbnail requests from a queue.
  amqp:
    enabled: false
    exchange: jthumbnail.exchange
    queue: thumbnail-jobs
    routing-key: thumbnail.request
    dead-letter-queue: thumbnail-jobs.dlq
    dead-letter-exchange: jthumbnail.dlx
    max-retries: 3
    consumer-concurrency: 1
    retry-delay-ms: 30000

  # gRPC server: high-performance RPC for thumbnail generation (streaming upload, GetJobStatus).
  grpc:
    enabled: false
    port: 9090
    use-tls: false
    # cert-chain-file: /path/to/server.pem
    # private-key-file: /path/to/key.pem

  # CMS / webhook connector: generic webhook endpoint with HMAC, replay protection, pluggable adapters.
  webhook:
    enabled: false
    path: /webhook
    # secret: "your-shared-secret"   # if set, X-Webhook-Signature (HMAC-SHA256) required
    signature-header: X-Webhook-Signature
    replay-window-seconds: 300
    idempotency-header: X-Idempotency-Key

  # Local filesystem watcher: auto-generate thumbnails when files are added to directories.
  watcher:
    enabled: false
    # directories: ["/data/inbox", "/var/watch"]
    poll-interval-ms: 1000
    debounce-ms: 2000      # wait after last event before considering file ready
    stabilization-ms: 500 # require file size unchanged for this long (partial uploads)
    max-retries: 3
    processed-dir: processed   # move source file here on success (relative to each watch dir)
    failed-dir: failed         # move source file here on failure

# Spring Data / JPA (H2 file DB so jobs survive restart)
spring:
  datasource:
    url: jdbc:h2:file:./data/jthumbnail;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: jthumbnail-job-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

server.port: 8081
# Spring Doc
springdoc:
  api-docs.path: "/api-docs"
  swagger-ui.path: "/swagger-ui.html"

# Actuator: health and metrics for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Rate limiting (requests per minute per client; applied to thumbnail upload and job APIs)
jthumbnailer:
  rate-limit:
    enabled: true
    requests-per-minute: 60
