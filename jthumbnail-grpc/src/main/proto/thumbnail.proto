syntax = "proto3";

package jthumbnail;

option java_package = "io.github.makbn.jthumbnail.grpc";
option java_outer_classname = "ThumbnailProto";
option java_multiple_files = true;

// Thumbnail gRPC service: streaming upload and job status.
service ThumbnailService {

  // Client streams file chunks; server responds with job_id (async job submission).
  rpc GenerateThumbnail(stream UploadChunk) returns (GenerateThumbnailResponse);

  // Get status of a thumbnail job by id.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
}

// First message in stream should be metadata (filename); subsequent messages are data chunks.
message UploadChunk {

  oneof payload {
    UploadMetadata meta = 1;
    bytes chunk = 2;
  }
}

message UploadMetadata {

  // Suggested filename (e.g. document.pdf) for temp file and logging.
  string filename = 1;
}

message GenerateThumbnailResponse {

  string job_id = 1;
}

message GetJobStatusRequest {

  string job_id = 1;
}

message GetJobStatusResponse {

  string job_id = 1;
  string status = 2;   // PENDING, PROCESSING, COMPLETED, FAILED
  string error_message = 3;
  string thumbnail_path = 4;
}
