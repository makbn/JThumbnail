# Publish to GitHub Packages (runs on dev/* branches).
# For build and test on every push, see ci.yml.
name: Publish

on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

jobs:
  publish:
    if: contains(github.ref, 'dev/')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Publish to GitHub Packages
        uses: gradle/gradle-build-action@v3
        with:
          arguments: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
